<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER LLAMA: ULTIMATE EDITION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap');
        :root { --bg: #0b0c10; --panel: rgba(31, 40, 51, 0.9); --cyan: #05d9e8; --pink: #ff2a6d; --yellow: #f1c40f; --text: #e0e6ed; --danger: #d90429; }
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; font-family: 'Rajdhani', sans-serif; background: var(--bg); color: var(--text); overflow: hidden; text-transform: uppercase; }
        .game-wrapper { display: grid; grid-template-columns: 380px 1fr 380px; height: 100vh; }
        .sidebar { background: var(--panel); border-right: 2px solid var(--cyan); display: flex; flex-direction: column; padding: 20px; overflow-y: auto; backdrop-filter: blur(10px); }
        .sidebar.right { border-right: none; border-left: 2px solid var(--pink); }
        .main-engine { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; }
        .hud-display { text-align: center; background: rgba(0,0,0,0.8); padding: 20px 40px; border: 2px solid var(--cyan); box-shadow: 0 0 15px rgba(5,217,232,0.4); margin-bottom: 20px; }
        #wool-val { font-size: 3.5rem; font-weight: 700; color: var(--cyan); text-shadow: 0 0 10px var(--cyan); }
        #llama-btn { font-size: 140px; background: none; border: none; cursor: pointer; transition: transform 0.05s; filter: drop-shadow(0 0 20px rgba(5,217,232,0.4)); }
        #llama-btn:active { transform: scale(0.85); }
        .upgrade-card { background: rgba(0,0,0,0.5); border: 1px solid var(--cyan); padding: 10px; margin-bottom: 8px; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .upgrade-card:hover:not(.disabled) { background: rgba(5, 217, 232, 0.15); box-shadow: inset 0 0 10px var(--cyan); }
        .upgrade-card.disabled { opacity: 0.3; cursor: not-allowed; }
        .card-header { display: flex; justify-content: space-between; font-weight: bold; }
        .action-btn { background: #000; border: 2px solid var(--cyan); color: var(--cyan); padding: 12px; font-family: inherit; font-weight: bold; cursor: pointer; margin: 5px; transition: 0.2s; }
        .action-btn:hover { background: var(--cyan); color: #000; }
        .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(10px); }
        .modal { background: #0b0c10; border: 2px solid var(--cyan); padding: 30px; width: 450px; text-align: center; }
        input { background: #000; border: 1px solid var(--cyan); color: var(--cyan); padding: 10px; width: 80%; margin: 10px 0; text-align: center; font-family: inherit; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--cyan); }
    </style>
</head>
<body>
<div class="game-wrapper">
    <div class="sidebar">
        <h3 style="color:var(--cyan)">POWER (CLICK)</h3>
        <div id="list-click"></div>
        <h3 style="color:var(--yellow); margin-top:20px;">DESIGN (SKINS)</h3>
        <div id="list-design"></div>
    </div>
    <div class="main-engine">
        <div class="hud-display">
            <div id="wool-val">0</div>
            <div id="rank-tag" style="background:var(--pink); color:#000; padding:2px 10px; font-weight:bold; font-size: 14px;">NOVICE</div>
            <div style="margin-top:10px; font-size:14px;">
                CLICK: <span id="stat-click" style="color:var(--cyan)">1</span> | APS: <span id="stat-ps" style="color:var(--pink)">0</span>
            </div>
        </div>
        <button id="llama-btn">🦙</button>
        <div style="margin-top:30px; display:flex;">
            <button class="action-btn" style="border-color:var(--pink); color:var(--pink)" onclick="UI.show('modal-casino')">CASINO</button>
            <button class="action-btn" style="border-color:var(--yellow); color:var(--yellow)" onclick="UI.show('modal-bank')">BANK</button>
        </div>
    </div>
    <div class="sidebar right">
        <h3 style="color:var(--pink)">AUTO_SCRIPTS</h3>
        <div id="list-auto"></div>
        <button class="action-btn" style="margin-top:auto; border-color:var(--danger); color:var(--danger)" onclick="UI.show('modal-reset')">PRESTIGE</button>
    </div>
</div>

<div id="modal-bank" class="overlay">
    <div class="modal" style="border-color:var(--yellow)">
        <h2 style="color:var(--yellow)">BANKING SYSTEM</h2>
        <p>BALANCE: <span id="bank-balance">0</span> W</p>
        <input type="number" id="bank-deposit" placeholder="AMOUNT">
        <button class="action-btn" style="width:100%" onclick="Bank.lock(1, 1.2)">1 MIN (+20%)</button>
        <div id="bank-timer" style="display:none; margin:15px 0;">
            <h2 id="b-time">00:00</h2>
            <button class="action-btn" id="b-claim" disabled onclick="Bank.claim()">CLAIM</button>
        </div>
        <button class="action-btn" style="width:100%" onclick="UI.hide()">CLOSE</button>
    </div>
</div>

<div id="modal-casino" class="overlay">
    <div class="modal" style="border-color:var(--pink)">
        <h2 style="color:var(--pink)">CASINO</h2>
        <p>CHIPS: <span id="casino-balance">0</span> W</p>
        <div id="game-coin">
            <div id="coin-res" style="margin:20px 0;">ORACLE SAYS...</div>
            <input type="number" id="coin-bet" placeholder="BET">
            <button class="action-btn" onclick="Casino.play('HEADS')">HEADS</button>
            <button class="action-btn" style="color:var(--pink)" onclick="Casino.play('TAILS')">TAILS</button>
        </div>
        <button class="action-btn" style="width:100%; margin-top:10px" onclick="UI.hide()">EXIT</button>
    </div>
</div>

<div id="modal-reset" class="overlay">
    <div class="modal" style="border-color:var(--danger)">
        <h2 style="color:var(--danger)">PRESTIGE</h2>
        <p>1B WOOL = +1% BONUS</p>
        <button class="action-btn" style="width:100%" onclick="alert('NOT ENOUGH WOOL')">BURN PROGRESS</button>
        <button class="action-btn" style="width:100%" onclick="UI.hide()">ABORT</button>
    </div>
</div>

<script>
const Core = {
    save: { wool: 0, click: 1, auto: 0, prestige: 1, inv: {}, skin: "🦙", bank: { active: false, end: 0, val: 0 } },
    db: {
        click: [],
        auto: [],
        design: []
    },
    
    generateDB() {
        const icons = ["🦾","⚡","🔥","💉","🧬","🔮","💎","🧿","📡","🛸","🪐","💥","🐲","👑","💫","🌑","☀️","☢️","☣️","⚡","🛰️","🔋","🔌","💻","🖱️","🕹️","🗡️","🏹","🛡️","☄️"];
        const animals = ["🐑","🐐","🐎","🐕","🐈","🦁","🐯","🦒","🐘","🦊","🐻","🐼","🐨","🦦","🐉","🦄","🦖","🐙","🦈","👽","🤖","👻","🧛","🧚","🧞","🧙","🧑‍🚀","👹","🌑","🌌"];
        
        for(let i=1; i<=30; i++) {
            this.db.click.push({ id: `c${i}`, n: `Power Module v${i}`, p: Math.floor(10 * Math.pow(1.8, i)), v: Math.floor(2 * Math.pow(1.6, i)) });
            this.db.auto.push({ id: `a${i}`, n: `Neural Bot v${i}`, p: Math.floor(50 * Math.pow(1.9, i)), v: Math.floor(5 * Math.pow(1.7, i)) });
            this.db.design.push({ id: `d${i}`, n: `Skin: ${animals[i-1]}`, p: Math.floor(100 * Math.pow(2.1, i)), icon: animals[i-1] });
        }
    },

    init() {
        this.generateDB();
        const local = localStorage.getItem('cyber_llama_ultra');
        if(local) this.save = JSON.parse(local);
        document.getElementById('llama-btn').onclick = () => this.doClick();
        setInterval(() => this.tick(), 1000);
        this.render(); this.update();
    },

    doClick() {
        this.save.wool += this.save.click * this.save.prestige;
        this.update();
    },

    tick() {
        this.save.wool += this.save.auto * this.save.prestige;
        if(this.save.bank.active && Date.now() >= this.save.bank.end) {
            document.getElementById('b-claim').disabled = false;
            document.getElementById('b-time').innerText = "READY";
        } else if (this.save.bank.active) {
            let s = Math.floor((this.save.bank.end - Date.now())/1000);
            document.getElementById('b-time').innerText = `00:${s<10?'0':''}${s}`;
        }
        this.update(); this.saveData();
    },

    update() {
        document.getElementById('wool-val').innerText = Math.floor(this.save.wool).toLocaleString();
        document.getElementById('stat-click').innerText = Math.floor(this.save.click * this.save.prestige).toLocaleString();
        document.getElementById('stat-ps').innerText = Math.floor(this.save.auto * this.save.prestige).toLocaleString();
        document.getElementById('llama-btn').innerText = this.save.skin;
        document.getElementById('bank-balance').innerText = Math.floor(this.save.wool).toLocaleString();
        document.getElementById('casino-balance').innerText = Math.floor(this.save.wool).toLocaleString();
        
        document.querySelectorAll('.upgrade-card').forEach(card => {
            card.classList.toggle('disabled', this.save.wool < card.dataset.cost);
        });
    },

    render() {
        const build = (cat, box) => {
            const el = document.getElementById(box); el.innerHTML = '';
            this.db[cat].forEach(item => {
                const count = this.save.inv[item.id] || 0;
                const cost = Math.floor(item.p * Math.pow(1.2, count));
                const div = document.createElement('div');
                div.className = 'upgrade-card';
                div.dataset.cost = cost;
                div.innerHTML = `<div class="card-header"><span>${item.n} ${count>0?`[${count}]`:''}</span><span style="color:var(--yellow)">${cost.toLocaleString()}</span></div>`;
                div.onclick = () => {
                    if(this.save.wool >= cost) {
                        this.save.wool -= cost;
                        this.save.inv[item.id] = count + 1;
                        if(cat === 'click') this.save.click += item.v;
                        if(cat === 'auto') this.save.auto += item.v;
                        if(cat === 'design') this.save.skin = item.icon;
                        this.render(); this.update();
                    }
                };
                el.appendChild(div);
            });
        };
        build('click', 'list-click'); build('auto', 'list-auto'); build('design', 'list-design');
    },
    saveData() { localStorage.setItem('cyber_llama_ultra', JSON.stringify(this.save)); }
};

const UI = {
    show(id) { document.getElementById(id).style.display = 'flex'; Core.update(); },
    hide() { document.querySelectorAll('.overlay').forEach(e => e.style.display = 'none'); }
};

const Bank = {
    lock(mins, mult) {
        const val = parseInt(document.getElementById('bank-deposit').value);
        if(val > Core.save.wool || val <= 0) return;
        Core.save.wool -= val;
        Core.save.bank = { active: true, end: Date.now() + (mins*60000), val: Math.floor(val * mult) };
        document.getElementById('bank-timer').style.display = 'block';
    },
    claim() {
        Core.save.wool += Core.save.bank.val;
        Core.save.bank.active = false;
        document.getElementById('bank-timer').style.display = 'none';
        UI.hide();
    }
};

const Casino = {
    play(side) {
        const bet = parseInt(document.getElementById('coin-bet').value);
        if(bet > Core.save.wool || bet <= 0) return;
        Core.save.wool -= bet;
        const res = Math.random() > 0.5 ? 'HEADS' : 'TAILS';
        document.getElementById('coin-res').innerText = "RESULT: " + res;
        if(side === res) Core.save.wool += bet * 2;
        Core.update();
    }
};

window.onload = () => Core.init();
</script>
</body>
</html>
